<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Profil - Pilotage Projet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        body { background-color: #F8FAFC !important; font-family: sans-serif; }
        .profile-card {
            background: white;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .input-pill {
            background-color: #F1F5F9;
            border: 1px solid #F1F5F9;
            border-radius: 1.25rem;
            transition: all 0.3s ease;
        }
        .input-pill:focus {
            background-color: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* Design de la nouvelle alerte (Toast) */
        #custom-alert {
            transform: translateY(-150%);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #custom-alert.show {
            transform: translateY(20px);
        }
    </style>
</head>
<body class="text-slate-900 overflow-hidden">

    <div id="custom-alert" class="fixed top-0 left-0 right-0 z-[100] flex justify-center pointer-events-none">
        <div id="alert-bg" class="bg-slate-900/90 backdrop-blur-md text-white px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-4 border border-white/10 pointer-events-auto max-w-sm mx-4">
            <div id="alert-icon" class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0">
                </div>
            <div class="flex flex-col">
                <p id="alert-title" class="font-black text-xs uppercase tracking-widest opacity-50"></p>
                <p id="alert-message" class="text-sm font-bold leading-tight"></p>
            </div>
        </div>
    </div>

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm">
            <span class="text-xl font-black text-slate-800 tracking-tight">Mon Profil</span>
        </div>
        <a href="index.html" class="bg-slate-100 text-slate-600 px-5 py-2.5 rounded-xl text-sm font-black hover:bg-slate-200 transition-all flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            RETOUR
        </a>
    </nav>

    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center p-6">
        <div class="profile-card p-10 w-full max-w-md text-center">
            
            <div class="relative inline-block mb-6">
                <div class="w-24 h-24 bg-indigo-600 text-white rounded-[2rem] flex items-center justify-center mx-auto text-4xl font-black shadow-xl shadow-indigo-100" id="user-initials">
                    ?
                </div>
            </div>

            <h2 class="text-2xl font-black text-slate-800 tracking-tight mb-1" id="user-email">Chargement...</h2>
            <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-8">Utilisateur Authentifié</p>

            <div class="text-left space-y-6 pt-6 border-t border-slate-50">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Nouveau mot de passe</label>
                    <input type="password" id="new-password" placeholder="Minimum 6 caractères" 
                        class="input-pill w-full p-4 outline-none font-bold text-slate-700">
                </div>

                <button onclick="updateUserPassword()" 
                    class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 hover:-translate-y-1 transition-all">
                    METTRE À JOUR
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfFtIqMSOddPS6NG4AQqDJ2W3KaBfKzUE",
            authDomain: "pilotage-gantt.firebaseapp.com",
            databaseURL: "https://pilotage-gantt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pilotage-gantt",
            storageBucket: "pilotage-gantt.firebasestorage.app",
            messagingSenderId: "1064606456262",
            appId: "1:1064606456262:web:39e19391518d3cab93fac7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // NOUVELLE FONCTION D'ALERTE BEAUTIFULL
        window.showAlert = (type, title, message) => {
            const el = document.getElementById('custom-alert');
            const icon = document.getElementById('alert-icon');
            const bg = document.getElementById('alert-bg');
            
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;

            if(type === 'success') {
                icon.innerHTML = '✅';
                icon.className = "w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 bg-emerald-500/20 text-xl";
            } else {
                icon.innerHTML = '⚠️';
                icon.className = "w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 bg-red-500/20 text-xl";
            }

            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-initials').textContent = user.email.charAt(0).toUpperCase();
            } else {
                setTimeout(() => { if (!auth.currentUser) window.location.href = 'index.html'; }, 1000); 
            }
        });

        window.updateUserPassword = async () => {
            const user = auth.currentUser;
            const newPass = document.getElementById('new-password').value;

            if (newPass.length < 6) {
                showAlert('error', 'Attention', 'Minimum 6 caractères requis.');
                return;
            }

            try {
                await updatePassword(user, newPass);
                showAlert('success', 'Succès', 'Mot de passe mis à jour !');
                document.getElementById('new-password').value = "";
            } catch (error) {
                if (error.code === 'auth/requires-recent-login') {
                    showAlert('error', 'Sécurité', 'Veuillez vous déconnecter et vous reconnecter pour valider.');
                } else {
                    showAlert('error', 'Erreur', error.message);
                }
            }
        };
    </script>
</body>
</html>
