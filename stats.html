<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Consolidé - Tous Responsables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-animate {
            animation: slideIn 0.4s ease-out forwards;
            opacity: 0;
        }

        .person-card {
            transition: all 0.3s ease;
        }

        .person-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }

        .modal-backdrop {
            backdrop-filter: blur(10px);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .badge-critical {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .stat-card {
            transition: all 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .task-item {
            transition: background 0.2s;
        }

        .task-item:hover {
            background: #f8fafc;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-900 font-sans min-h-screen">

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen" class="fixed inset-0 bg-slate-100 flex items-center justify-center z-[200] hidden">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-8">
                <span class="bg-indigo-600 text-white p-3 rounded-2xl text-xl font-bold">GP</span>
                <h1 class="text-2xl font-bold mt-4 text-slate-800">Accès Restreint</h1>
            </div>
            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="Email"
                    class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none">
                <input type="password" id="login-password" placeholder="Mot de passe"
                    class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none">
                <button onclick="login()"
                    class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition">Se
                    connecter</button>
                <p id="login-error" class="text-red-500 text-xs text-center hidden font-bold mt-2"></p>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-5">
            <div class="flex items-center gap-3">
                <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-xl object-cover shadow-sm"
                    onerror="this.style.display='none'">
                <div class="flex flex-col leading-none">
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">
                        SUIVI <span class="text-indigo-600">CONSOLIDÉ</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 font-semibold mt-0.5">Projets + Tâches Libres</p>
                </div>
            </div>
            <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-50 border border-slate-100">
                <svg class="w-2 h-2 text-emerald-500" fill="currentColor" viewBox="0 0 8 8">
                    <circle cx="4" cy="4" r="3" />
                </svg>
                <span id="last-update" class="text-[9px] text-slate-400 font-black uppercase tracking-widest"></span>
            </div>
        </div>
        
        <div class="flex items-center gap-3 bg-white/80 backdrop-blur-md p-2 rounded-3xl border border-slate-200 shadow-xl shadow-slate-100/50">
            <button onclick="exportToCSV()"
                class="group px-4 py-2.5 flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-sm transition-all duration-200 shadow-sm">
                <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
                </svg>
                <span>EXPORT</span>
            </button>
            <a href="index.html"
                class="group px-4 py-2.5 flex items-center gap-2 hover:bg-slate-50 text-slate-600 hover:text-slate-900 rounded-2xl font-bold text-sm transition-all duration-200">
                <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path d="M19 12H5M5 12L12 19M5 12L12 5" />
                </svg>
                <span>RETOUR</span>
            </a>
        </div>
    </div>
</nav>

    <main class="max-w-7xl mx-auto p-6">

        <!-- KPI GLOBAUX -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-red-200 stat-card card-animate">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-black uppercase text-red-400">Retards Totaux</p>
                    <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 8v4M12 16h.01" />
                        </svg>
                    </div>
                </div>
                <h2 id="stat-total-delays" class="text-4xl font-black text-red-500 mb-1">0</h2>
                <p class="text-xs text-slate-500 font-semibold">Tâches en dépassement</p>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-orange-200 stat-card card-animate"
                style="animation-delay: 0.1s">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-black uppercase text-orange-400">À Venir (7j)</p>
                    <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
                            <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
                        </svg>
                    </div>
                </div>
                <h2 id="stat-upcoming" class="text-4xl font-black text-orange-500 mb-1">0</h2>
                <p class="text-xs text-slate-500 font-semibold">Échéances proches</p>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 stat-card card-animate"
                style="animation-delay: 0.2s">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-black uppercase text-indigo-400">Charge Totale</p>
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg>
                    </div>
                </div>
                <h2 id="stat-total-hours" class="text-4xl font-black text-indigo-600 mb-1">0</h2>
                <p class="text-xs text-slate-500 font-semibold">Heures restantes</p>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 stat-card card-animate"
                style="animation-delay: 0.3s">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-black uppercase text-slate-400">Tâches Actives</p>
                    <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                            <path d="M9 11l3 3L22 4" />
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                        </svg>
                    </div>
                </div>
                <h2 id="stat-active-tasks" class="text-4xl font-black text-slate-700 mb-1">0</h2>
                <p class="text-xs text-slate-500 font-semibold">En cours</p>
            </div>
        </div>

        <!-- FILTRE PAR RESPONSABLE -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-10">
            <div class="flex items-center gap-4 flex-wrap">
                <label class="text-sm font-black text-slate-600">Filtrer par responsable :</label>
                <select id="filter-person" onchange="applyPersonFilter()"
                    class="flex-1 max-w-xs p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none font-bold text-sm">
                    <option value="all">👥 Tous les responsables</option>
                </select>
                <button onclick="resetFilters()"
                    class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold text-slate-600 transition">
                    Réinitialiser
                </button>
            </div>
        </div>

        <!-- GRILLE DES RESPONSABLES -->
        <h3 class="text-sm font-black uppercase text-slate-400 mb-6 tracking-widest flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
            Alertes par Responsable
        </h3>
        <div id="people-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            <div class="col-span-full py-10 text-center text-slate-400 italic">Chargement...</div>
        </div>

    </main>

    <!-- MODAL DÉTAILS PERSONNE -->
    <div id="person-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center modal-backdrop">
        <div
            class="bg-white rounded-3xl shadow-2xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-hidden modal-content">
            <!-- En-tête modal -->
            <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 p-6 text-white sticky top-0 z-10">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 id="modal-person-name" class="text-2xl font-black">Nom Personne</h3>
                        <p id="modal-person-subtitle" class="text-indigo-100 text-sm font-semibold mt-1"></p>
                    </div>
                    <button onclick="closePersonModal()"
                        class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 transition flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3">
                            <path d="M18 6L6 18M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Contenu modal -->
            <div class="p-6 overflow-y-auto" style="max-height: calc(90vh - 120px);">
                <!-- Onglets -->
                <div class="flex gap-2 mb-6 border-b border-slate-200">
                    <button onclick="switchTab('retards')" id="tab-retards"
                        class="tab-button px-4 py-2 font-bold text-sm transition border-b-2 border-red-500 text-red-600">
                        🔴 Retards (<span id="tab-count-retards">0</span>)
                    </button>
                    <button onclick="switchTab('upcoming')" id="tab-upcoming"
                        class="tab-button px-4 py-2 font-bold text-sm transition border-b-2 border-transparent text-slate-400 hover:text-slate-600">
                        🟠 À venir 7j (<span id="tab-count-upcoming">0</span>)
                    </button>
                    <button onclick="switchTab('all')" id="tab-all"
                        class="tab-button px-4 py-2 font-bold text-sm transition border-b-2 border-transparent text-slate-400 hover:text-slate-600">
                        📊 Toutes (<span id="tab-count-all">0</span>)
                    </button>
                </div>

                <!-- Contenu des onglets -->
                <div id="modal-tasks-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfFtIqMSOddPS6NG4AQqDJ2W3KaBfKzUE",
            authDomain: "pilotage-gantt.firebaseapp.com",
            databaseURL: "https://pilotage-gantt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pilotage-gantt",
            storageBucket: "pilotage-gantt.firebasestorage.app",
            messagingSenderId: "1064606456262",
            appId: "1:1064606456262:web:39e19391518d3cab93fac7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let allResponsables = {};
        let allProjects = [];
        let allTasksProjets = [];
        let allTasksLibres = [];
        let currentModalPerson = null;
        let currentTab = 'retards';

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errorEl.classList.add('hidden');
            } catch (e) {
                errorEl.innerText = "Identifiants incorrects";
                errorEl.classList.remove('hidden');
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            if (user) {
                if (loginScreen) loginScreen.classList.add('hidden');
                loadAllData();
            } else {
                if (loginScreen) loginScreen.classList.remove('hidden');
            }
        });

        function loadAllData() {
            // Charger les responsables
            onValue(ref(db, 'responsables'), (snap) => {
                allResponsables = snap.val() || {};
                populatePersonFilter();
                renderDashboard();
            });

            // Charger les projets
            onValue(ref(db, 'projects'), (snap) => {
                allProjects = snap.val() ? Object.values(snap.val()) : [];
                renderDashboard();
            });

            // Charger les tâches des projets
            onValue(ref(db, 'taches'), (snap) => {
                allTasksProjets = snap.val() ? Object.values(snap.val()) : [];
                renderDashboard();
            });

            // Charger les tâches libres
            onValue(ref(db, 'taches_libres'), (snap) => {
                allTasksLibres = snap.val() ? Object.values(snap.val()) : [];
                renderDashboard();
            });
        }

        function populatePersonFilter() {
            const select = document.getElementById('filter-person');
            const currentValue = select.value;

            select.innerHTML = '<option value="all">👥 Tous les responsables</option>' +
                Object.values(allResponsables).map(r =>
                    `<option value="${r.id}">👤 ${r.name}</option>`
                ).join('');

            select.value = currentValue;
        }

        function renderDashboard() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);

            // Agréger TOUTES les tâches (projets + libres)
            const allTasks = [
                ...allTasksProjets.map(t => ({ ...t, source: 'projet' })),
                ...allTasksLibres.map(t => ({ ...t, source: 'libre' }))
            ];

            // Filtrer les tâches actives uniquement
            const activeTasks = allTasks.filter(t => !t.done);

            // Calculer les KPI globaux avec la nouvelle logique de date de fin
            const totalDelays = activeTasks.filter(t => {
                const taskDate = t.dateDebut || t.date;
                if (!taskDate) return false;
                const dateDebut = new Date(taskDate);
                dateDebut.setHours(0, 0, 0, 0);
                const dureeJours = t.dureeJours || 1;
                const dateFin = new Date(dateDebut);
                dateFin.setDate(dateDebut.getDate() + dureeJours - 1);
                dateFin.setHours(23, 59, 59, 999);
                return today > dateFin;
            }).length;

            const upcomingTasks = activeTasks.filter(t => {
                const taskDate = t.dateDebut || t.date;
                if (!taskDate) return false;
                const dateTask = new Date(taskDate);
                return dateTask >= today && dateTask <= nextWeek;
            }).length;

            const totalHours = activeTasks.reduce((acc, t) => acc + parseFloat(t.time || 0), 0);

            document.getElementById('stat-total-delays').innerText = totalDelays;
            document.getElementById('stat-upcoming').innerText = upcomingTasks;
            document.getElementById('stat-total-hours').innerText = Math.round(totalHours) + 'h';
            document.getElementById('stat-active-tasks').innerText = activeTasks.length;

            // Mettre à jour l'heure
            document.getElementById('last-update').innerText =
                `Mis à jour : ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;

            // Grouper par responsable avec la nouvelle logique
            const tasksByPerson = {};

            activeTasks.forEach(t => {
                if (!t.who) return;
                if (!tasksByPerson[t.who]) {
                    tasksByPerson[t.who] = {
                        retards: [],
                        upcoming: [],
                        all: []
                    };
                }

                tasksByPerson[t.who].all.push(t);

                const taskDate = t.dateDebut || t.date;
                if (taskDate) {
                    const dateDebut = new Date(taskDate);
                    dateDebut.setHours(0, 0, 0, 0);
                    const dureeJours = t.dureeJours || 1;
                    const dateFin = new Date(dateDebut);
                    dateFin.setDate(dateDebut.getDate() + dureeJours - 1);
                    dateFin.setHours(23, 59, 59, 999);
                    
                    if (today > dateFin) {
                        tasksByPerson[t.who].retards.push(t);
                    } else if (dateFin >= today && dateDebut <= nextWeek) {
                        tasksByPerson[t.who].upcoming.push(t);
                    }
                }
            });

            // Filtrer selon la sélection
            const filterValue = document.getElementById('filter-person')?.value || 'all';
            let filteredPeople = Object.keys(tasksByPerson);

            if (filterValue !== 'all') {
                filteredPeople = filteredPeople.filter(id => id === filterValue);
            }

            // Trier par nombre de retards décroissant
            filteredPeople.sort((a, b) =>
                tasksByPerson[b].retards.length - tasksByPerson[a].retards.length
            );

            renderPeopleCards(filteredPeople, tasksByPerson, today);
        }

        function renderPeopleCards(peopleIds, tasksByPerson, today) {
            const container = document.getElementById('people-grid');
            container.innerHTML = '';

            if (peopleIds.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 text-center text-slate-400 italic">Aucune tâche active ou aucun responsable ne correspond aux filtres</div>';
                return;
            }

            peopleIds.forEach((personId, index) => {
                const person = allResponsables[personId];
                if (!person) return;

                const data = tasksByPerson[personId];
                const retardsCount = data.retards.length;
                const upcomingCount = data.upcoming.length;
                const totalCount = data.all.length;
                const totalHours = data.all.reduce((acc, t) => acc + parseFloat(t.time || 0), 0);

                // Déterminer la sévérité
                let severity = 'À JOUR';
                let colorClass = 'emerald';
                let bgClass = 'bg-emerald-50';
                let borderClass = 'border-emerald-200';

                if (retardsCount > 0) {
                    if (retardsCount > 5) {
                        severity = 'CRITIQUE';
                        colorClass = 'red';
                        bgClass = 'bg-red-50';
                        borderClass = 'border-red-300';
                    } else if (retardsCount > 2) {
                        severity = 'URGENT';
                        colorClass = 'orange';
                        bgClass = 'bg-orange-50';
                        borderClass = 'border-orange-300';
                    } else {
                        severity = 'ALERTE';
                        colorClass = 'yellow';
                        bgClass = 'bg-yellow-50';
                        borderClass = 'border-yellow-300';
                    }
                }

                container.innerHTML += `
                    <div class="bg-white rounded-3xl p-6 border-2 ${borderClass} person-card cursor-pointer card-animate shadow-sm hover:shadow-lg"
                         style="animation-delay: ${index * 0.1}s"
                         onclick="openPersonModal('${personId}')">
                        
                        <!-- En-tête -->
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-14 h-14 rounded-2xl ${bgClass} flex items-center justify-center font-black text-${colorClass}-600 text-xl">
                                    ${person.name.substring(0, 2).toUpperCase()}
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-800 text-lg">${person.name}</h4>
                                    <p class="text-xs text-slate-400 font-semibold">${totalCount} tâche(s) active(s)</p>
                                </div>
                            </div>
                            ${retardsCount > 0 ? `
                                <span class="badge-critical px-3 py-1.5 rounded-full text-xs font-black bg-${colorClass}-500 text-white shadow-md">
                                    ${severity}
                                </span>
                            ` : `
                                <span class="px-3 py-1.5 rounded-full text-xs font-black bg-emerald-100 text-emerald-600">
                                    ✓ ${severity}
                                </span>
                            `}
                        </div>

                        <!-- Statistiques -->
                        <div class="grid grid-cols-3 gap-3 mb-4">
                            <div class="${retardsCount > 0 ? 'bg-red-50' : 'bg-slate-50'} p-3 rounded-xl border ${retardsCount > 0 ? 'border-red-100' : 'border-slate-100'}">
                                <p class="text-[9px] font-bold ${retardsCount > 0 ? 'text-red-500' : 'text-slate-400'} uppercase mb-1">Retards</p>
                                <p class="text-xl font-black ${retardsCount > 0 ? 'text-red-600' : 'text-slate-600'}">${retardsCount}</p>
                            </div>
                            <div class="${upcomingCount > 0 ? 'bg-orange-50' : 'bg-slate-50'} p-3 rounded-xl border ${upcomingCount > 0 ? 'border-orange-100' : 'border-slate-100'}">
                                <p class="text-[9px] font-bold ${upcomingCount > 0 ? 'text-orange-500' : 'text-slate-400'} uppercase mb-1">7 jours</p>
                                <p class="text-xl font-black ${upcomingCount > 0 ? 'text-orange-600' : 'text-slate-600'}">${upcomingCount}</p>
                            </div>
                            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                                <p class="text-[9px] font-bold text-indigo-500 uppercase mb-1">Heures</p>
                                <p class="text-xl font-black text-indigo-600">${Math.round(totalHours)}</p>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-xs text-slate-500 font-semibold">
                                ${data.all.filter(t => t.source === 'projet').length} projet(s) • 
                                ${data.all.filter(t => t.source === 'libre').length} libre(s)
                            </span>
                            <span class="text-xs text-indigo-600 font-bold">Voir détails →</span>
                        </div>
                    </div>
                `;
            });
        }

        window.openPersonModal = function (personId) {
            currentModalPerson = personId;
            const person = allResponsables[personId];
            if (!person) return;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);

            // Agréger toutes les tâches de cette personne
            const allTasks = [
                ...allTasksProjets.map(t => ({ ...t, source: 'projet' })),
                ...allTasksLibres.map(t => ({ ...t, source: 'libre' }))
            ].filter(t => t.who === personId && !t.done);

            // Calculer les retards avec la nouvelle logique
            const retards = allTasks.filter(t => {
                const taskDate = t.dateDebut || t.date;
                if (!taskDate) return false;
                const dateDebut = new Date(taskDate);
                dateDebut.setHours(0, 0, 0, 0);
                const dureeJours = t.dureeJours || 1;
                const dateFin = new Date(dateDebut);
                dateFin.setDate(dateDebut.getDate() + dureeJours - 1);
                dateFin.setHours(23, 59, 59, 999);
                return today > dateFin;
            });

            const upcoming = allTasks.filter(t => {
                const taskDate = t.dateDebut || t.date;
                if (!taskDate) return false;
                const dateTask = new Date(taskDate);
                return dateTask >= today && dateTask <= nextWeek;
            });

            document.getElementById('modal-person-name').innerText = person.name;
            document.getElementById('modal-person-subtitle').innerText =
                `${allTasks.length} tâche(s) active(s) • ${retards.length} retard(s) • ${upcoming.length} à venir`;

            document.getElementById('tab-count-retards').innerText = retards.length;
            document.getElementById('tab-count-upcoming').innerText = upcoming.length;
            document.getElementById('tab-count-all').innerText = allTasks.length;

            currentTab = 'retards';
            switchTab('retards');

            document.getElementById('person-modal').classList.remove('hidden');
        };

        window.switchTab = function (tab) {
            currentTab = tab;

            // Réinitialiser les onglets
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-red-500', 'text-red-600', 'border-orange-500', 'text-orange-600', 'border-indigo-500', 'text-indigo-600');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            // Activer l'onglet sélectionné
            if (tab === 'retards') {
                document.getElementById('tab-retards').classList.remove('border-transparent', 'text-slate-400');
                document.getElementById('tab-retards').classList.add('border-red-500', 'text-red-600');
            } else if (tab === 'upcoming') {
                document.getElementById('tab-upcoming').classList.remove('border-transparent', 'text-slate-400');
                document.getElementById('tab-upcoming').classList.add('border-orange-500', 'text-orange-600');
            } else {
                document.getElementById('tab-all').classList.remove('border-transparent', 'text-slate-400');
                document.getElementById('tab-all').classList.add('border-indigo-500', 'text-indigo-600');
            }

            renderModalContent();
        };

        function renderModalContent() {
            if (!currentModalPerson) return;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);

            const allTasks = [
                ...allTasksProjets.map(t => ({ ...t, source: 'projet' })),
                ...allTasksLibres.map(t => ({ ...t, source: 'libre' }))
            ].filter(t => t.who === currentModalPerson && !t.done);

            let tasksToShow = [];

            if (currentTab === 'retards') {
                tasksToShow = allTasks.filter(t => {
                    const taskDate = t.dateDebut || t.date;
                    if (!taskDate) return false;
                    const dateDebut = new Date(taskDate);
                    dateDebut.setHours(0, 0, 0, 0);
                    const dureeJours = t.dureeJours || 1;
                    const dateFin = new Date(dateDebut);
                    dateFin.setDate(dateDebut.getDate() + dureeJours - 1);
                    dateFin.setHours(23, 59, 59, 999);
                    return today > dateFin;
                });
            } else if (currentTab === 'upcoming') {
                tasksToShow = allTasks.filter(t => {
                    const taskDate = t.dateDebut || t.date;
                    if (!taskDate) return false;
                    const dateTask = new Date(taskDate);
                    return dateTask >= today && dateTask <= nextWeek;
                });
            } else {
                tasksToShow = allTasks;
            }

            // Trier par date
            tasksToShow.sort((a, b) => {
                const dateA = a.dateDebut || a.date || 0;
                const dateB = b.dateDebut || b.date || 0;
                return new Date(dateA) - new Date(dateB);
            });

            const container = document.getElementById('modal-tasks-list');
            container.innerHTML = '';

            if (tasksToShow.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-10 italic">Aucune tâche dans cette catégorie 🎉</p>';
                return;
            }

            tasksToShow.forEach(t => {
                const taskDate = t.dateDebut || t.date;
                const taskDateObj = taskDate ? new Date(taskDate) : null;
                
                // Calculer la date de fin pour l'affichage
                let isLate = false;
                let daysInfo = 'Pas de date';
                
                if (taskDateObj) {
                    const dateDebut = new Date(taskDateObj);
                    dateDebut.setHours(0, 0, 0, 0);
                    const dureeJours = t.dureeJours || 1;
                    const dateFin = new Date(dateDebut);
                    dateFin.setDate(dateDebut.getDate() + dureeJours - 1);
                    dateFin.setHours(23, 59, 59, 999);
                    
                    isLate = today > dateFin;
                    
                    if (isLate) {
                        daysInfo = `-${Math.floor((today - dateFin) / (1000 * 60 * 60 * 24))}j`;
                    } else {
                        daysInfo = `Dans ${Math.ceil((dateDebut - today) / (1000 * 60 * 60 * 24))}j`;
                    }
                }

                const project = t.source === 'projet' ?
                    allProjects.find(p => p.id === t.projectId) : null;

                const sourceLabel = t.source === 'projet' ?
                    `📁 ${project?.name || 'Projet inconnu'}` :
                    '🎯 Tâche libre';

                const bgColor = isLate ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200';
                const badgeColor = isLate ? 'bg-red-500' : 'bg-orange-500';

                container.innerHTML += `
                    <div class="task-item ${bgColor} border rounded-xl p-4 transition">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1">
                                <h5 class="font-bold text-sm text-slate-800 mb-1">${t.desc}</h5>
                                <p class="text-xs text-slate-500 font-semibold">${sourceLabel}</p>
                            </div>
                            <span class="${badgeColor} text-white text-xs font-black px-2 py-1 rounded-lg whitespace-nowrap ml-3">
                                ${daysInfo}
                            </span>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-slate-600 font-semibold mt-3 pt-3 border-t border-slate-200">
                            <span>⏱️ ${t.time || 0}h</span>
                            <span>📅 ${taskDateObj ? taskDateObj.toLocaleDateString('fr-FR') : 'Non défini'}</span>
                            <span class="px-2 py-0.5 rounded ${t.priority === 'haute' ? 'bg-red-100 text-red-600' : t.priority === 'moyenne' ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'}">
                                ${t.priority || 'moyenne'}
                            </span>
                        </div>
                    </div>
                `;
            });
        }

        window.closePersonModal = function () {
            document.getElementById('person-modal').classList.add('hidden');
            currentModalPerson = null;
        };

        window.applyPersonFilter = function () {
            renderDashboard();
        };

        window.resetFilters = function () {
            document.getElementById('filter-person').value = 'all';
            renderDashboard();
        };

        window.exportToCSV = function () {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);

            const allTasks = [
                ...allTasksProjets.map(t => ({ ...t, source: 'Projet' })),
                ...allTasksLibres.map(t => ({ ...t, source: 'Libre' }))
            ].filter(t => !t.done);

            const csv = [
                ['Responsable', 'Tâche', 'Source', 'Projet', 'Priorité', 'Heures', 'Échéance', 'Statut', 'Retard (jours)'],
                ...allTasks.map(t => {
                    const person = allResponsables[t.who];
                    const taskDate = t.dateDebut || t.date;
                    const taskDateObj = taskDate ? new Date(taskDate) : null;
                    
                    let isLate = false;
                    let daysLate = 0;
                    
                    if (taskDateObj) {
                        const dateDebut = new Date(taskDateObj);
                        dateDebut.setHours(0, 0, 0, 0);
                        const dureeJours = t.dureeJours || 1;
                        const dateFin = new Date(dateDebut);
                        dateFin.setDate(dateDebut.getDate() + dureeJours - 1);
                        dateFin.setHours(23, 59, 59, 999);
                        
                        isLate = today > dateFin;
                        if (isLate) {
                            daysLate = Math.floor((today - dateFin) / (1000 * 60 * 60 * 24));
                        }
                    }
                    
                    const status = isLate ? 'RETARD' : (taskDateObj && taskDateObj <= nextWeek) ? 'À VENIR 7J' : 'NORMAL';
                    const project = t.source === 'Projet' ? allProjects.find(p => p.id === t.projectId) : null;

                    return [
                        person?.name || 'Inconnu',
                        `"${t.desc}"`,
                        t.source,
                        project ? `"${project.name}"` : 'N/A',
                        t.priority || 'moyenne',
                        t.time || 0,
                        taskDateObj ? taskDateObj.toLocaleDateString('fr-FR') : 'Non défini',
                        status,
                        daysLate
                    ];
                })
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `suivi-consolide-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>
