<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#4f46e5">

    <link rel="icon" type="image/png" href="./icon.png">
    <title>Pilotage Projet</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfFtIqMSOddPS6NG4AQqDJ2W3KaBfKzUE",
            authDomain: "pilotage-gantt.firebaseapp.com",
            databaseURL: "https://pilotage-gantt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pilotage-gantt",
            storageBucket: "pilotage-gantt.firebasestorage.app",
            messagingSenderId: "1064606456262",
            appId: "1:1064606456262:web:39e19391518d3cab93fac7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.auth = auth;
        window.fbDB = db;
        window.fbMethods = { ref, set, onValue, update, remove };

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errorEl.classList.add('hidden');
            } catch (e) {
                errorEl.innerText = "Identifiants incorrects";
                errorEl.classList.remove('hidden');
            }
        };

        window.logout = async () => {
            const logoutScreen = document.getElementById('logout-screen');

            document.getElementById('login-email').value = "";
            document.getElementById('login-password').value = "";

            try {
                logoutScreen.classList.remove('hidden');
                setTimeout(() => {
                    logoutScreen.classList.remove('opacity-0');
                    logoutScreen.classList.add('opacity-100');
                }, 10);

                await signOut(auth);

                setTimeout(() => {
                    window.location.reload();
                }, 2500);

            } catch (e) {
                window.location.reload();
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            if (user) {
                if (loginScreen) loginScreen.classList.add('hidden');

                loadAllData();
                setupConnectionStatus();

                const statusId = btoa(user.email).replace(/[/+=]/g, "");
                const userStatusRef = ref(db, 'status/' + statusId);
                onValue(ref(db, '.info/connected'), (snap) => {
                    if (snap.val() === true) {
                        onDisconnect(userStatusRef).set({ state: 'offline' });
                        set(userStatusRef, { state: 'online' });
                    }
                });
            } else {
                if (loginScreen) loginScreen.classList.remove('hidden');
            }
        });

        function setupConnectionStatus() {
            onValue(ref(db, ".info/connected"), (snap) => {
                const dot = document.getElementById('workflow-dot');
                const txt = document.getElementById('workflow-text');
                if (dot && txt) {
                    dot.className = snap.val() ? "w-2 h-2 rounded-full bg-emerald-500" : "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                    txt.innerText = snap.val() ? "CLOUD : ONLINE" : "CLOUD : OFFLINE";
                }
            });
        }
    </script>

    <style>
        body {
            background-color: #F8FAFC !important;
        }

        .resizable-gantt {
            resize: vertical;
            overflow: auto;
            min-height: 500px;
            max-height: 80vh;
            width: 100%;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .modal-active {
            display: flex !important;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .gantt .grid-row text {
            cursor: pointer;
            fill: #6366f1;
            font-weight: 800;
            font-size: 12px;
        }

        .gantt .grid-row text:hover {
            fill: #4338ca;
            text-decoration: underline;
        }

        .gantt .bar-label {
            font-weight: 700;
            font-size: 11px;
            fill: #1e293b;
        }

        .gantt .bar-progress {
            stroke-width: 0;
        }

        .btn-stats {
            background-color: #e0e7ff;
            color: #4338ca;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-stats:hover {
            background-color: #c7d2fe;
            transform: translateY(-1px);
        }

        .animate-in {
            animation: modalScale 0.2s ease-out forwards;
        }

        @keyframes modalScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .resizable-gantt {
            overflow: auto;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        #gantt-chart svg {
            vertical-align: top;
            display: block;
        }

        #gantt-container {
            overflow-x: auto;
            overflow-y: hidden;
        }

        .gantt {
            display: block;
        }

        .project-tooltip {
            position: absolute;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            padding: 12px 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 1000;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .project-tooltip.visible {
            opacity: 1;
        }

        .project-tooltip p {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            margin: 0;
            white-space: pre-wrap;
        }

        /* Style pour le champ de recherche */
        #filter-search:focus {
            width: 18rem;
        }

        #filter-search::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
