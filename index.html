<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <title>Pilotage Projet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfFtIqMSOddPS6NG4AQqDJ2W3KaBfKzUE",
            authDomain: "pilotage-gantt.firebaseapp.com",
            databaseURL: "https://pilotage-gantt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pilotage-gantt",
            storageBucket: "pilotage-gantt.firebasestorage.app",
            messagingSenderId: "1064606456262",
            appId: "1:1064606456262:web:39e19391518d3cab93fac7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.fbDB = db;
        window.fbMethods = { ref, set, onValue, update, remove };

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errorEl.classList.add('hidden');
            } catch (e) {
                errorEl.innerText = "Identifiants incorrects";
                errorEl.classList.remove('hidden');
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            if (user) {
                if (loginScreen) loginScreen.classList.add('hidden');
                
                // Déclenchement du chargement et du statut
                loadAllData(); 
                setupConnectionStatus();
                
                const statusId = btoa(user.email).replace(/[/+=]/g, "");
                const userStatusRef = ref(db, 'status/' + statusId);
                onValue(ref(db, '.info/connected'), (snap) => {
                    if (snap.val() === true) {
                        onDisconnect(userStatusRef).set({ state: 'offline' });
                        set(userStatusRef, { state: 'online' });
                    }
                });
            } else {
                if (loginScreen) loginScreen.classList.remove('hidden');
            }
        });

        function setupConnectionStatus() {
            onValue(ref(db, ".info/connected"), (snap) => {
                const dot = document.getElementById('workflow-dot');
                const txt = document.getElementById('workflow-text');
                if (dot && txt) {
                    dot.className = snap.val() ? "w-2 h-2 rounded-full bg-emerald-500" : "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                    txt.innerText = snap.val() ? "CLOUD : ONLINE" : "CLOUD : OFFLINE";
                }
            });
        }
    </script>

    <style>
        body { background-color: #F8FAFC !important; }
        .resizable-gantt { 
            resize: vertical; overflow: auto; min-height: 500px; max-height: 80vh; width: 100%; 
            border: 1px solid #e2e8f0; background: white; border-radius: 1.5rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        .modal-active { display: flex !important; animation: modalIn 0.3s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .gantt .grid-row text { cursor: pointer; fill: #6366f1; font-weight: 800; font-size: 12px; }
        .gantt .grid-row text:hover { fill: #4338ca; text-decoration: underline; }
        .gantt .bar-label { font-weight: 700; font-size: 11px; fill: #1e293b; }
        .gantt .bar-progress { stroke-width: 0; }
    </style>
</head>
<body class="text-slate-900 font-sans">

    <div id="login-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[200] hidden">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md border border-white/20 text-center">
            <div class="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-indigo-100 mb-6">
                <img src="icon.png" class="w-12 h-12 invert brightness-0" alt="Logo">
            </div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Pilotage Projet</h1>
            <p class="text-slate-400 text-sm mt-2 mb-8">Accès sécurisé réservé</p>

            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="Email professionnel" 
                    class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all">
                <input type="password" id="login-password" placeholder="Mot de passe" 
                    class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all">
                <button onclick="login()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-indigo-100 hover:bg-indigo-700 hover:-translate-y-1 transition-all">SE CONNECTER</button>
                <p id="login-error" class="text-red-500 text-xs font-bold hidden bg-red-50 py-3 rounded-xl"></p>
            </div>
        </div>
    </div>

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-40">
        <div class="flex items-center gap-5">
            <div class="flex items-center gap-3">
                <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm">
                <span class="text-xl font-black text-slate-800 tracking-tight hidden md:block">Pilotage Gantt</span>
            </div>
            <div id="workflow-status" class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-50 border border-slate-100 text-[9px] font-black text-slate-400 uppercase tracking-widest">
                <span id="workflow-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                <span id="workflow-text">Sync...</span>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex bg-slate-100 p-1 rounded-xl mr-2">
                <a href="responsables.html" class="px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-white hover:shadow-sm transition-all">👥 Équipe</a>
                <a href="profil.html" class="px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-white hover:shadow-sm transition-all">👤 Profil</a>
            </div>
            <button onclick="openForm()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl hover:bg-indigo-700 font-black shadow-lg shadow-indigo-100 transition-all active:scale-95 text-sm">+ PROJET</button>
            <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-500 transition-colors" title="Déconnexion">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="p-4 md:p-8 max-w-[1920px] mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <div>
                <h2 class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em] mb-1">Planning Opérationnel</h2>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Tableau de bord</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="save-status" class="text-[10px] font-black text-emerald-500 opacity-0 transition-opacity bg-emerald-50 px-3 py-1 rounded-lg">SYNCHRONISÉ</div>
                <div class="flex bg-white p-1 rounded-2xl border border-slate-200 shadow-sm font-black text-[10px] uppercase tracking-wider text-slate-400">
                    <button onclick="changeView('Day')" class="px-5 py-2 hover:text-indigo-600 rounded-xl transition">Jour</button>
                    <button onclick="changeView('Week')" class="px-5 py-2 hover:text-indigo-600 border-x border-slate-100 rounded-xl transition">Semaine</button>
                    <button onclick="changeView('Month')" class="px-5 py-2 hover:text-indigo-600 rounded-xl transition">Mois</button>
                </div>
            </div>
        </div>

        <div id="gantt-container" class="resizable-gantt">
            <div id="gantt-chart"></div>
        </div>
    </main>

    <div id="form-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <aside class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-lg border border-white animate-in zoom-in duration-300">
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-100">
                <h2 class="font-black text-2xl text-slate-800 tracking-tight">Édition Projet</h2>
                <button onclick="closeForm()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-red-50 hover:text-red-500 transition-all">&times;</button>
            </div>

            <div class="mb-8 p-5 bg-indigo-50/50 rounded-[1.5rem] border border-indigo-100">
                <label class="block text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2 ml-1">Sélection Rapide</label>
                <select id="project-selector" onchange="loadProjectInForm(this.value)" 
                    class="w-full p-3 rounded-xl bg-white border border-indigo-200 outline-none text-sm font-bold text-slate-700 shadow-sm">
                    <option value="">-- Nouveau Projet --</option>
                </select>
            </div>

            <input type="hidden" id="p-id">
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Nom du projet</label>
                    <input type="text" id="p-name" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all font-bold">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Responsable</label>
                        <select id="p-owner" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Statut</label>
                        <select id="p-status" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold outline-none">
                            <option value="À faire">À faire</option>
                            <option value="En cours" selected>En cours</option>
                            <option value="Terminé">Terminé</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Début</label>
                        <input type="date" id="p-start" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Fin</label>
                        <input type="date" id="p-end" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 font-bold text-sm">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Avancement</label>
                        <span class="text-indigo-600 font-black text-sm" id="prog-val">0%</span>
                    </div>
                    <input type="range" id="p-progress" min="0" max="100" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                </div>

                <div class="flex flex-col gap-3 pt-6">
                    <button onclick="addOrUpdateProject()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 hover:-translate-y-1 transition-all">ENREGISTRER</button>
                    <button id="btn-delete" onclick="deleteProject()" class="hidden w-full bg-red-50 text-red-500 py-3 rounded-2xl font-black text-xs hover:bg-red-100 transition-all">SUPPRIMER LE PROJET</button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        let projects = [];
        let responsables = [];
        let gantt;
        let currentView = 'Day';

        const getColor = (name) => {
            let hash = 0;
            if (!name) return '#6366f1';
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 65%, 50%)`;
        };

        function loadAllData() {
            if (!window.fbMethods) return setTimeout(loadAllData, 200);
            const { onValue, ref } = window.fbMethods;

            onValue(ref(window.fbDB, 'responsables'), (snap) => {
                const data = snap.val();
                responsables = data ? Object.values(data) : [];
                document.getElementById('p-owner').innerHTML = responsables.map(r => 
                    `<option value="${r.id}">${r.name}</option>`
                ).join('') || '<option value="">Aucun membre</option>';
            });

            onValue(ref(window.fbDB, 'projects'), (snap) => {
                const data = snap.val();
                projects = data ? Object.values(data) : [];
                renderGantt();
                updateProjectSelector();
            });
        }

        function updateProjectSelector() {
            const selector = document.getElementById('project-selector');
            if (!selector) return;
            let html = '<option value="">-- Nouveau Projet --</option>';
            projects.forEach(p => { html += `<option value="${p.id}">${p.name}</option>`; });
            selector.innerHTML = html;
        }

        function loadProjectInForm(id) {
            if (!id) { 
                document.getElementById('p-id').value = '';
                document.getElementById('p-name').value = '';
                document.getElementById('p-progress').value = 0;
                document.getElementById('prog-val').innerText = "0%";
                document.getElementById('btn-delete').classList.add('hidden');
                return; 
            }
            editProject(id);
        }

        function renderGantt(view = currentView) {
            currentView = view;
            const chartEl = document.getElementById('gantt-chart');
            
            if (!projects || projects.length === 0) {
                chartEl.innerHTML = `<div class="p-20 text-center text-slate-300 font-bold italic">Aucun projet actif.</div>`;
                return;
            }

            const tasks = projects.map(p => {
                const respoFound = responsables.find(r => r.id === p.owner);
                const displayName = respoFound ? respoFound.name : (p.owner || "Inconnu");
                return {
                    id: p.id,
                    name: `${p.name} [${displayName}]`,
                    start: p.start || new Date().toISOString().split('T')[0],
                    end: p.end || new Date().toISOString().split('T')[0],
                    progress: p.progress || 0,
                    custom_class: p.status === "Terminé" ? 'project-finished' : ''
                };
            });

            chartEl.innerHTML = '';
            
            gantt = new Gantt("#gantt-chart", tasks, {
                language: 'fr',
                view_mode: view,
                bar_height: 38,
                on_click: task => { window.location.href = `liste_taches.html?id=${task.id}`; },
                on_date_change: (task, start, end) => updateQuick(task.id, {
                    start: start.toISOString().split('T')[0],
                    end: end.toISOString().split('T')[0]
                }),
                on_progress_change: (task, progress) => updateQuick(task.id, { progress })
            });

            setTimeout(() => {
                projects.forEach(p => {
                    const bar = document.querySelector(`[data-id="${p.id}"] .bar-progress`);
                    if (bar) {
                        const color = p.status === "Terminé" ? '#94a3b8' : getColor(p.owner);
                        bar.style.setProperty('fill', color, 'important');
                    }
                });
                
                document.querySelectorAll('.gantt .grid-row text').forEach((el, idx) => {
                    el.onclick = (e) => {
                        e.stopPropagation();
                        if(projects[idx]) editProject(projects[idx].id);
                    };
                });
            }, 150);
        }

        async function updateQuick(id, data) {
            await window.fbMethods.update(window.fbMethods.ref(window.fbDB, 'projects/' + id), data);
            showStatus("SYNCHRO OK");
        }

        async function addOrUpdateProject() {
            const startVal = document.getElementById('p-start').value;
            const endVal = document.getElementById('p-end').value;
            if (startVal && endVal && new Date(endVal) < new Date(startVal)) {
                alert("Erreur de dates !"); return;
            }
            const id = document.getElementById('p-id').value || "ID-" + Date.now();
            const pData = {
                id,
                name: document.getElementById('p-name').value,
                owner: document.getElementById('p-owner').value,
                status: document.getElementById('p-status').value,
                start: startVal,
                end: endVal,
                progress: parseInt(document.getElementById('p-progress').value) || 0
            };
            await window.fbMethods.set(window.fbMethods.ref(window.fbDB, 'projects/' + id), pData);
            closeForm();
            showStatus("ENREGISTRÉ");
        }

        async function deleteProject() {
            const id = document.getElementById('p-id').value;
            if (id && confirm("Supprimer ce projet ?")) {
                await window.fbMethods.remove(window.fbMethods.ref(window.fbDB, 'projects/' + id));
                closeForm();
                showStatus("EFFACÉ");
            }
        }

        function editProject(id) {
            const p = projects.find(i => i.id === id);
            if(!p) return;
            document.getElementById('p-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-owner').value = p.owner;
            document.getElementById('p-status').value = p.status;
            document.getElementById('p-start').value = p.start;
            document.getElementById('p-end').value = p.end;
            document.getElementById('p-progress').value = p.progress;
            document.getElementById('prog-val').innerText = p.progress + "%";
            document.getElementById('btn-delete').classList.remove('hidden');
            document.getElementById('project-selector').value = p.id;
            openForm(true);
        }

        function openForm(isEdit = false) { 
            if (isEdit !== true) {
                document.getElementById('p-id').value = '';
                document.getElementById('p-name').value = '';
                document.getElementById('p-progress').value = 0;
                document.getElementById('prog-val').innerText = "0%";
                document.getElementById('btn-delete').classList.add('hidden');
                document.getElementById('project-selector').value = '';
            }
            document.getElementById('form-overlay').classList.add('modal-active'); 
        }

        function closeForm() {
            document.getElementById('form-overlay').classList.remove('modal-active');
        }

        function changeView(v) { renderGantt(v); }

        function showStatus(txt) {
            const s = document.getElementById('save-status');
            s.innerText = "✅ " + txt; s.style.opacity = "1";
            setTimeout(() => s.style.opacity = "0", 3000);
        }

        document.getElementById('p-progress').oninput = function() {
            document.getElementById('prog-val').innerText = this.value + "%";
        };
    </script>
</body>
</html>
