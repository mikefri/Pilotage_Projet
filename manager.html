<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Performance Logistique - Édition Totale</title>
    <style>
        :root {
            --dark-teal: #004d4d;
            --bright-green: #2ecc71;
            --border-color: #333;
            --cell-bg: #e9e9e9;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f4f4f4; }
        .container { width: 100%; max-width: 1000px; background-color: white; border: 2px solid var(--border-color); padding: 20px; box-sizing: border-box; }

        /* Header */
        .header { 
            display: grid; 
            grid-template-columns: 100px 1fr 100px; 
            align-items: center; 
            margin-bottom: 15px; 
            gap: 15px; 
        }
        
        .logo-spmi { width: 80px; height: auto; display: block; }
        .horloge-pilote { width: 55px; height: auto; justify-self: end; }

        .main-title { 
            background-color: var(--bright-green); 
            color: white; padding: 10px; font-weight: bold; 
            font-size: 1.3rem; text-align: center; 
            text-transform: uppercase; border: 1px solid var(--dark-teal); 
        }

        /* Sections */
        .sub-header, .section-title, .situation-title { background-color: var(--dark-teal); color: white; text-align: center; padding: 10px; margin-bottom: 5px; font-weight: bold; }

        /* Champ Objectif Éditable */
        .objective-container { text-align: center; margin-bottom: 25px; }
        .editable-objective { 
            background-color: var(--bright-green); 
            color: white; 
            border: 1px solid var(--dark-teal);
            padding: 10px; 
            width: 60%; 
            font-weight: bold; 
            text-align: center;
            font-size: 1rem;
            outline: none;
        }

        /* Champ Tournée */
        .tournee-field { margin-bottom: 20px; }
        .editable-input { 
            border: 2px solid var(--border-color); 
            padding: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 1rem;
        }

        /* Tableau */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { border: 2px solid var(--border-color); padding: 10px 5px; background-color: white; font-size: 0.95rem; }
        td { border: 1px solid white; background-color: var(--cell-bg); height: 50px; }

        .table-input { width: 100%; height: 100%; border: none; background-color: transparent; padding: 5px; box-sizing: border-box; text-align: center; font-size: 0.9rem; }
        .table-input:focus { background-color: #fff; outline: 2px solid var(--bright-green); }

        .col-tendance { width: 80px; }
        .tendance-select {
            width: 100%; height: 100%; border: none; background-color: transparent;
            cursor: pointer; text-align: center; font-size: 1.8rem; appearance: none;
        }

        .status-ok { background-color: #c8e6c9 !important; }
        .status-encours { background-color: #fff9c4 !important; }
        .status-nok { background-color: #ffcdd2 !important; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img class="logo-spmi" src="https://mikefri.github.io/Pilotage_Projet/asset/spmi.png" alt="Logo SPMI">
        <div class="main-title">COMPRENDRE POUR PERFORMER</div>
        <img class="horloge-pilote" src="https://mikefri.github.io/Pilotage_Projet/asset/M00.png" alt="Horloge M00">
    </div>

    <div class="sub-header">Performance - Méthode Logistique</div>
    
    <div class="tournee-field">
        <input type="text" class="editable-input" value="Tournée Terrain : DET / DUO / DPX">
    </div>

    <div class="section-title">OBJECTIF</div>
    
    <div class="objective-container">
        <input type="text" class="editable-objective" value="0 projet prioritaire en retard">
    </div>

    <div class="situation-title">SITUATION ACTUELLE</div>
    <table>
        <thead>
            <tr>
                <th style="width: 18%;">Projets</th>
                <th style="width: 12%;">Statut</th>
                <th style="width: 15%;">Responsable</th>
                <th style="width: 32%;">Observation</th>
                <th style="width: 8%;">AV%</th>
                <th class="col-tendance">Tendance</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    const rows = 6;
    const tableBody = document.getElementById('table-body');

    for (let i = 0; i < rows; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="table-input"></td>
            <td><input type="text" class="table-input"></td>
            <td><input type="text" class="table-input"></td>
            <td><input type="text" class="table-input"></td>
            <td><input type="text" class="table-input"></td>
            <td>
                <select class="tendance-select" onchange="updateColor(this)">
                    <option value=""></option>
                    <option value="ok">😊</option>
                    <option value="encours">😐</option>
                    <option value="nok">☹️</option>
                </select>
            </td>
        `;
        tableBody.appendChild(tr);
    }

    function updateColor(selectElement) {
        const cell = selectElement.parentElement;
        cell.classList.remove('status-ok', 'status-encours', 'status-nok');
        if (selectElement.value === 'ok') cell.classList.add('status-ok');
        if (selectElement.value === 'encours') cell.classList.add('status-encours');
        if (selectElement.value === 'nok') cell.classList.add('status-nok');
    }
</script>

</body>
</html>
