<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PILOTAGE PERFORMANCE LOGISTIQUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dark-teal: #004d4d;
            --bright-green: #2ecc71;
            --border-color: #333;
            --cell-bg: #e9e9e9;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 350px;
            background-color: white;
            border-right: 4px solid var(--dark-teal);
            padding: 20px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: -350px;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 10px 0 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .toggle-tab {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background: var(--dark-teal);
            color: white;
            padding: 20px 8px;
            cursor: pointer;
            z-index: 1001;
            border-radius: 0 10px 10px 0;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
        }

        .sidebar.open+.toggle-tab {
            left: 350px;
        }

        .project-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .project-item:hover {
            background-color: #f9f9f9;
        }

        .project-item span {
            font-weight: 700;
            color: #333;
        }

        /* --- TABLEAU --- */
        .container {
            width: 95%;
            max-width: 1450px;
            margin: 20px auto;
            background: white;
            border: 2px solid var(--border-color);
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            border: 2px solid var(--border-color);
            padding: 12px;
            background: white;
            font-weight: 800;
            text-transform: uppercase;
        }

        td {
            border: 1px solid white;
            background: var(--cell-bg);
            height: 95px;
            vertical-align: middle;
        }

        .table-textarea {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            resize: none;
            outline: none;
            overflow: hidden;
            display: block;
        }

        .main-title {
            background: var(--bright-green);
            color: white;
            padding: 18px;
            font-weight: 900;
            font-size: 1.8rem;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid var(--dark-teal);
        }

        .section-header {
            background: var(--dark-teal);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 15px;
        }

        .smiley-icon {
            width: 55px;
            height: 55px;
            margin: auto;
        }

        .status-ok {
            background-color: #c6efce !important;
        }

        .status-encours {
            background-color: #ffeb9c !important;
        }

        .status-nok {
            background-color: #ffc7ce !important;
        }

        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }

        /* --- STYLE IMPRESSION PORTRAIT OPTIMISÉ --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.5in;
            }

            .sidebar,
            #toggle-tab,
            .btn-retour,
            #login-screen {
                display: none !important;
            }

            html,
            body {
                height: 100%;
                background-color: white !important;
            }

            .container {
                display: flex !important;
                flex-direction: column !important;
                height: 98vh !important;
                width: 100% !important;
                max-width: none !important;
                border: 3px solid black !important;
                padding: 15px !important;
                margin: 0 !important;
            }

            table {
                flex: 1 !important;
                width: 100% !important;
                border-collapse: collapse !important;
            }

            th {
                font-size: 1.2rem !important;
                border: 2px solid black !important;
                padding: 10px !important;
            }

            td {
                border: 1px solid black !important;
                background-color: #e9e9e9 !important;
                font-size: 1.2rem !important;
                font-weight: 800 !important;
                padding: 10px !important;
            }

            .table-textarea {
                font-size: 1.2rem !important;
                font-weight: 800 !important;
                color: black !important;
            }

            .smiley-icon {
                width: 60px !important;
                height: 60px !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>

    <div id="sidebar" class="sidebar">
        <div class="flex justify-between items-center mb-6 border-b-2 border-black pb-2">
            <h2 class="font-black text-xl uppercase italic">Projets</h2>
            <a href="index.html" class="btn-retour text-red-600 font-bold text-sm">RETOUR</a>
        </div>
        <div id="project-list-sidebar"></div>
    </div>

    <div id="toggle-tab" class="toggle-tab" onclick="toggleSidebar()">▶</div>

    <div class="main-content">
        <div id="login-screen" class="hidden">
            <div class="bg-white p-10 rounded shadow-2xl w-96">
                <h2 class="text-2xl font-black mb-6 text-center uppercase">Connexion</h2>
                <input type="email" id="login-email" placeholder="Email" class="w-full p-3 border mb-4">
                <input type="password" id="login-password" placeholder="Mot de passe" class="w-full p-3 border mb-6">
                <button onclick="login()" class="w-full bg-emerald-600 text-white p-3 font-black">ENTRER</button>
            </div>
        </div>

        <div class="container">
            <div class="grid grid-cols-[120px_1fr_120px] items-center mb-6 gap-6">
                <a href="index.html" target="_blank">
                    <img src="asset/spmi.png" style="width:110px"
                        onerror="this.src='https://cdn-icons-png.flaticon.com/512/711/711769.png'">
                </a>

                <div class="main-title">Comprendre pour Performer</div>

                <div class="flex justify-end">
                    <img src="asset/M00.png" style="width:80px; cursor:pointer;" onclick="window.print()"
                        title="Imprimer le rapport">
                </div>
            </div>

            <div class="section-header">Performance - Méthode Logistique</div>
            <div class="border-2 border-black p-4 text-center font-black text-2xl uppercase bg-yellow-50 mb-4">
                Tournée Terrain : DET / DUO / DPX
            </div>

            <div class="section-header">Objectif</div>
            <div class="flex justify-center mb-4">
                <div
                    class="bg-[#2ecc71] text-white border-2 border-[#004d4d] p-4 w-3/4 font-black text-center text-3xl shadow-lg">
                    0 PROJET EN RETARD
                </div>
            </div>

            <div class="section-header">Situation Actuelle</div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 24%;">Projets</th>
                        <th style="width: 12%;">Statut</th>
                        <th style="width: 15%;">Responsable</th>
                        <th style="width: 31%;">Observation</th>
                        <th style="width: 8%;">AV%</th>
                        <th style="width: 10%;">Tendance</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfFtIqMSOddPS6NG4AQqDJ2W3KaBfKzUE",
            authDomain: "pilotage-gantt.firebaseapp.com",
            databaseURL: "https://pilotage-gantt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pilotage-gantt",
            storageBucket: "pilotage-gantt.firebasestorage.app",
            messagingSenderId: "1064606456262",
            appId: "1:1064606456262:web:39e19391518d3cab93fac7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let projectsData = [];
        let responsablesMap = {};
        let reportingData = {};
        let selectedProjectIds = [];

        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const tab = document.getElementById('toggle-tab');
            sb.classList.toggle('open');
            tab.innerText = sb.classList.contains('open') ? "◀" : "▶";
        };

        window.login = () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, e, p).catch(() => alert("Erreur"));
        };

        onAuthStateChanged(auth, (user) => {
            if (user) { document.getElementById('login-screen').classList.add('hidden'); initApp(); }
            else { document.getElementById('login-screen').classList.remove('hidden'); }
        });

        function initApp() {
            onValue(ref(db, 'responsables'), (s) => {
                responsablesMap = {};
                if (s.val()) Object.values(s.val()).forEach(r => responsablesMap[r.id] = r.name);
                renderTable();
            });
            onValue(ref(db, 'reporting'), (s) => { reportingData = s.val() || {}; renderTable(); });
            onValue(ref(db, 'projects'), (s) => {
                projectsData = s.val() ? Object.values(s.val()) : [];
                projectsData.sort((a, b) => (a.status === 'Terminé' ? 1 : -1));
                if (selectedProjectIds.length === 0) selectedProjectIds = projectsData.slice(0, 8).map(p => p.id);
                renderSidebar();
                renderTable();
            });
        }

        function renderSidebar() {
            const list = document.getElementById('project-list-sidebar');
            list.innerHTML = '';
            const sortedProjects = [...projectsData].sort((a, b) => (parseInt(a.priority) || 2) - (parseInt(b.priority) || 2));

            sortedProjects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'project-item';
                const isChecked = selectedProjectIds.includes(p.id);
                const prioText = p.priority === "1" ? "(P1)" : p.priority === "3" ? "(P3)" : "(P2)";

                div.innerHTML = `
                    <div class="w-[30px] flex justify-center flex-shrink-0">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} class="w-4 h-4" onclick="event.stopPropagation(); toggleProject('${p.id}')">
                    </div>
                    <span class="text-[10px] text-gray-500 mr-2 flex-shrink-0">${prioText}</span>
                    <span class="text-[14px] leading-tight">${p.name}</span>
                `;
                
                div.onclick = () => {
                    toggleProject(p.id);
                };
                list.appendChild(div);
            });
        }

        window.toggleProject = (id) => {
            if (selectedProjectIds.includes(id)) {
                selectedProjectIds = selectedProjectIds.filter(i => i !== id);
            } else {
                selectedProjectIds.push(id);
            }
            renderSidebar(); // Important pour mettre à jour les cases à cocher
            renderTable();   // Important pour mettre à jour le tableau
        };

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            const filtered = projectsData.filter(p => selectedProjectIds.includes(p.id));

            filtered.forEach((p) => {
                const report = reportingData[p.id] || {};
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><textarea class="table-textarea text-[#004d4d]" readonly>${p.name}</textarea></td>
                    <td><div class="flex items-center justify-center h-full font-black uppercase text-center text-xs">${p.status}</div></td>
                    <td><div class="flex items-center justify-center h-full text-center font-bold text-sm">${responsablesMap[p.owner] || ''}</div></td>
                    <td><textarea class="table-textarea" onchange="saveData('${p.id}', 'obs', this.value)">${report.obs || ''}</textarea></td>
                    <td><div class="flex items-center justify-center h-full font-black text-xl">${p.progress}%</div></td>
                    <td class="${report.trend ? 'status-' + report.trend : ''}" onclick="cycleTrend('${p.id}', '${report.trend || ''}')">
                        <div class="flex items-center justify-center h-full cursor-pointer">
                            <img src="${report.trendImg || ''}" class="smiley-icon" style="${report.trendImg ? '' : 'display:none'}">
                        </div>
                    </td>
                `;
                body.appendChild(tr);
            });
        }

        window.cycleTrend = (pId, current) => {
            const trends = [
                { val: 'ok', img: 'asset/smiley_vert.png' },
                { val: 'encours', img: 'asset/smiley_orange.png' },
                { val: 'nok', img: 'asset/smiley_rouge.png' },
                { val: '', img: '' }
            ];
            let idx = trends.findIndex(t => t.val === current);
            let next = trends[(idx + 1) % trends.length];
            update(ref(db, `reporting/${pId}`), { trend: next.val, trendImg: next.img });
        };

        window.saveData = (pId, f, v) => update(ref(db, `reporting/${pId}`), { [f]: v });
    </script>
</body>

</html>
