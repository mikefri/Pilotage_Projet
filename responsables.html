<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion de l'Équipe</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Config Firebase (Inchangée)
        const firebaseConfig = {
            apiKey: "AIzaSyDfFtIqMSOddPS6NG4AQqDJ2W3KaBfKzUE",
            authDomain: "pilotage-gantt.firebaseapp.com",
            databaseURL: "https://pilotage-gantt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pilotage-gantt",
            storageBucket: "pilotage-gantt.firebasestorage.app",
            messagingSenderId: "1064606456262",
            appId: "1:1064606456262:web:39e19391518d3cab93fac7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.fbDB = db;
        window.fbMethods = { ref, set, onValue, remove, update };

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                document.getElementById('login-error').innerText = "Identifiants incorrects";
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        
        // --- NOUVEAU : GESTION DE LA PRÉSENCE ---
        const userStatusRef = ref(db, 'status/' + btoa(user.email).replace(/[/+=]/g, ""));
        const connectedRef = ref(db, '.info/connected');

        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                // Quand je me déconnecte (fermeture onglet), Firebase met "offline"
                update(userStatusRef, { state: 'online', last_changed: Date.now() });
                set(ref(db, 'status/' + btoa(user.email).replace(/[/+=]/g, "")), { state: 'online' });
                // Action automatique à la déconnexion
                onDisconnect(userStatusRef).set({ state: 'offline', last_changed: Date.now() });
            }
        });
        // ---------------------------------------

        loadRespos();
    } else {
        document.getElementById('login-screen').classList.remove('hidden');
    }
});

// Ajoute cette fonction pour écouter les statuts de TOUTE l'équipe
let statusOnline = {};
function listenToStatus() {
    const { onValue, ref } = window.fbMethods;
    onValue(ref(window.fbDB, 'status'), (snapshot) => {
        statusOnline = snapshot.val() || {};
        renderList(); // On rafraîchit la liste dès qu'un statut change
    });
}
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

<div id="login-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[200] hidden">
    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-white/20">
        <div class="text-center mb-10">
            <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-200">
                <span class="text-white text-2xl font-black">GP</span>
            </div>
            <h1 class="text-3xl font-black mt-6 text-slate-800 tracking-tight">Accès Privé</h1>
            <p class="text-slate-500 mt-2">Identifiez-vous pour gérer l'équipe</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="login-email" placeholder="Email professionnel" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <input type="password" id="login-password" placeholder="Mot de passe" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <button onclick="login()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100 hover:bg-indigo-700 hover:-translate-y-1 transition-all duration-300">Se connecter</button>
            <p id="login-error" class="text-red-500 text-sm text-center hidden font-semibold mt-2"></p>
        </div>
    </div>
</div>

<nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-8 py-4 flex items-center shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-4">
        <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-xl shadow-md">
        <h1 class="text-xl font-black text-slate-800 tracking-tight hidden md:block">Pilotage Équipe</h1>
    </div>
    
    <div class="flex-1"></div>

    <div class="flex items-center gap-6">
        <div id="save-status" class="hidden md:block text-[10px] uppercase tracking-widest font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-600 opacity-0 transition-all duration-500"></div>
        <a href="profil.html" class="flex items-center gap-2 text-slate-600 hover:text-indigo-600 font-bold transition-colors">
            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs">👤</div>
            <span class="text-sm">Mon Profil</span>
        </a>
        <a href="index.html" class="bg-indigo-50 text-indigo-600 px-5 py-2 rounded-xl text-sm font-black hover:bg-indigo-100 transition-all">← RETOUR</a>
    </div>
</nav>

<main class="max-w-4xl mx-auto p-6 md:p-12">
    <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <h1 class="text-4xl font-black text-slate-800 tracking-tight">L'Équipe</h1>
            <p class="text-slate-500 mt-2 text-lg">Gérez les membres et leurs accès.</p>
        </div>
        <div class="text-slate-400 text-sm font-medium" id="member-count">0 membre(s)</div>
    </div>

    <div class="bg-white p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100 mb-12">
        <input type="hidden" id="edit-id">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-wider text-slate-400 ml-1">Nom du responsable</label>
                <input type="text" id="respo-name" placeholder="Ex: Jean Dupont" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-wider text-slate-400 ml-1">Adresse Email</label>
                <input type="email" id="respo-email" placeholder="email@sncf.fr" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all">
            </div>
        </div>
        <div class="mt-8 flex gap-3">
            <button id="btn-save" onclick="saveResponsable()" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-1 transition-all active:scale-95">Ajouter à l'équipe</button>
            <button id="btn-cancel" onclick="resetForm()" class="hidden flex-1 px-6 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black hover:bg-slate-200 transition-all">Annuler</button>
        </div>
    </div>

    <div id="respo-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        </div>
</main>

<div id="custom-modal" class="hidden fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full p-8 text-center animate-in zoom-in duration-300">
        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">⚠️</div>
        <h3 id="modal-title" class="text-xl font-black text-slate-800 mb-2"></h3>
        <p id="modal-text" class="text-slate-500 text-sm mb-8 leading-relaxed"></p>
        <div class="flex gap-3">
            <button id="modal-cancel" class="flex-1 px-6 py-3 text-slate-500 font-bold bg-slate-100 rounded-xl hover:bg-slate-200 transition-all">Non</button>
            <button id="modal-confirm" class="flex-1 px-6 py-3 bg-red-500 text-white font-bold rounded-xl shadow-lg shadow-red-100 hover:bg-red-600 transition-all">Supprimer</button>
        </div>
    </div>
</div>

<script>
    let responsables = {};

    function loadRespos() {
        if (!window.fbMethods) return setTimeout(loadRespos, 100);
        const { onValue, ref } = window.fbMethods;
        onValue(ref(window.fbDB, 'responsables'), (snapshot) => {
            responsables = snapshot.val() || {};
            renderList();
        });
    }

    function renderList() {
        const list = document.getElementById('respo-list');
        const keys = Object.keys(responsables);
        document.getElementById('member-count').innerText = `${keys.length} membre(s)`;
        
        if (keys.length === 0) {
            list.classList.remove('grid');
            list.innerHTML = `
                <div class="text-center py-20 bg-white rounded-[2rem] border-2 border-dashed border-slate-200">
                    <p class="text-slate-400 font-medium">L'équipe est vide pour le moment.</p>
                </div>`;
            return;
        }

        list.classList.add('grid');
        list.innerHTML = keys.map(id => {
            const respo = responsables[id];
            const initial = respo.name.charAt(0).toUpperCase();
            return `
                <div class="group flex items-center justify-between p-5 bg-white border border-slate-100 rounded-3xl shadow-sm hover:shadow-xl hover:shadow-indigo-500/5 transition-all duration-300 border-l-4 border-l-transparent hover:border-l-indigo-500">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-lg group-hover:scale-110 transition-transform">
                            ${initial}
                        </div>
                        <div class="flex flex-col">
                            <span class="font-black text-slate-700 leading-tight">${respo.name}</span>
                            <span class="text-xs font-medium text-slate-400 mt-1">${respo.email || 'Email non renseigné'}</span>
                        </div>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editRespo('${id}')" class="p-2 text-indigo-500 hover:bg-indigo-50 rounded-xl transition-all" title="Modifier">✏️</button>
                        <button onclick="removeRespo('${id}')" class="p-2 text-red-400 hover:bg-red-50 rounded-xl transition-all" title="Supprimer">🗑️</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function saveResponsable() {
        const name = document.getElementById('respo-name').value.trim();
        const email = document.getElementById('respo-email').value.trim();
        const editId = document.getElementById('edit-id').value;
        
        if(!name) return alert("Le nom est obligatoire");

        const { set, ref } = window.fbMethods;
        const id = editId || btoa(unescape(encodeURIComponent(name))).replace(/[/+=]/g, "");

        await set(ref(window.fbDB, 'responsables/' + id), {
            id: id,
            name: name,
            email: email
        });

        resetForm();
        showStatus(editId ? "Modifié" : "Ajouté");
    }

    function editRespo(id) {
        const respo = responsables[id];
        document.getElementById('edit-id').value = id;
        document.getElementById('respo-name').value = respo.name;
        document.getElementById('respo-email').value = respo.email || "";
        
        document.getElementById('btn-save').innerText = "Enregistrer les modifications";
        document.getElementById('btn-save').classList.replace('bg-indigo-600', 'bg-emerald-600');
        document.getElementById('btn-cancel').classList.remove('hidden');
        document.getElementById('respo-name').focus();
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('respo-name').value = "";
        document.getElementById('respo-email').value = "";
        document.getElementById('btn-save').innerText = "Ajouter à l'équipe";
        document.getElementById('btn-save').classList.replace('bg-emerald-600', 'bg-indigo-600');
        document.getElementById('btn-cancel').classList.add('hidden');
    }

    function removeRespo(id) {
        showConfirm("Supprimer ?", `Voulez-vous vraiment retirer ${responsables[id].name} de l'équipe projet ?`, async () => {
            const { remove, ref } = window.fbMethods;
            await remove(ref(window.fbDB, 'responsables/' + id));
            showStatus("Supprimé");
        });
    }

    function showStatus(txt) {
        const s = document.getElementById('save-status');
        s.innerText = `✅ ${txt}`; 
        s.style.opacity = "1";
        setTimeout(() => s.style.opacity = "0", 3000);
    }

    function showConfirm(title, message, onConfirm) {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = message;
        modal.classList.remove('hidden');
        document.getElementById('modal-confirm').onclick = () => { modal.classList.add('hidden'); onConfirm(); };
        document.getElementById('modal-cancel').onclick = () => modal.classList.add('hidden');
    }
</script>
</body>
</html>
